version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Berlin
    groups:
      python-development-dependencies:
        dependency-type: development
    ignore:
      # These exact pins intentionally test different Home Assistant releases.
      - dependency-name: pytest-homeassistant-custom-component
      - dependency-name: pycares
    labels:
      - dependencies
    open-pull-requests-limit: 5
