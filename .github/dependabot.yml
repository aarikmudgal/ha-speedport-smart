version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Berlin
    groups:
      python-development-dependencies:
        dependency-type: development
    ignore:
      # These exact fixture pins intentionally test separate HA releases.
      - dependency-name: pytest-homeassistant-custom-component
      # HA 2025.12's aiodns 3.x cannot use pycares 5's breaking API.
      - dependency-name: pycares
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
    open-pull-requests-limit: 5
