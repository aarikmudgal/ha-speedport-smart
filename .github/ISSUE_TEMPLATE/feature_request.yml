name: Feature request
description: Suggest a focused improvement for Telekom Speedport Smart.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What should a Home Assistant user be able to accomplish?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe entities, controls, or dashboard behavior you expect.
    validations:
      required: true

  - type: input
    id: router
    attributes:
      label: Router model and firmware
      placeholder: Speedport Smart 4R Typ A, firmware 010152.5.0.001.0

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This report contains no router credentials, raw responses, or private household data.
          required: true
        - label: I searched existing issues and requests.
          required: true
