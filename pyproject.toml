[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-speedport-smart"
version = "0.1.0"
description = "Capability-driven Home Assistant integration for Telekom Speedport routers"
readme = "README.md"
requires-python = ">=3.13.2"
license = "MIT"
authors = [{ name = "Aarik Mudgal" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
]

[project.urls]
Documentation = "https://github.com/aarikmudgal/ha-speedport-smart#readme"
Issues = "https://github.com/aarikmudgal/ha-speedport-smart/issues"
Repository = "https://github.com/aarikmudgal/ha-speedport-smart"

[project.optional-dependencies]
test = [
  "pytest-homeassistant-custom-component==0.13.316",
  "aioresponses>=0.7.8",
  "mypy>=1.14",
  "ruff>=0.9",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["custom_components*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.speedport_smart" = [
  "brand/*.png",
  "frontend/*.js",
  "icons.json",
  "manifest.json",
  "strings.json",
  "translations/*.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --cov=custom_components.speedport_smart --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
branch = true
source = ["custom_components.speedport_smart"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",
  "C901",
  "COM812",
  "CPY001",
  "D203",
  "D212",
  "EM101",
  "EM102",
  "ISC001",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "TC003",
  "TID252",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["INP001", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
exclude = ["tests"]
